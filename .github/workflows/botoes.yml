name: Botões Telegram (Aprovar/Descartar)

on:
  workflow_dispatch:

concurrency:
  group: aspin-botoes
  cancel-in-progress: false

jobs:
  buttons:
    name: Processar aprovações e gravar na planilha
    # Com runner próprio (variável RUNNER=self-hosted) os minutos são ilimitados.
    runs-on: ${{ vars.RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 8
    permissions:
      contents: read
      actions: write   # vigia: dispara a coleta se o agendamento do GitHub atrasar
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      DATAJUD_API_KEY: ${{ secrets.DATAJUD_API_KEY }}
      SHEETS_WEBHOOK_URL: ${{ secrets.SHEETS_WEBHOOK_URL }}
      SHEETS_TOKEN: ${{ secrets.SHEETS_TOKEN }}
      TELEGRAM_APPROVERS: ${{ vars.TELEGRAM_APPROVERS || '' }}
      DATAJUD_TRIBUNALS: api_publica_tjsp
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Importar configuração protegida
        env:
          ASPIN_CONFIG_BUNDLE: ${{ secrets.ASPIN_ENV || secrets.ACCS }}
        run: python .github/scripts/import_config.py
      - name: Processar cliques e planilha
        run: python -m app.worker --process-buttons
