name: Radar ASPIN (newsletter das 7h)

# Dias úteis: monta e envia a newsletter por e-mail e no canal do Telegram. O robô sempre ligado dispara às
# 06h50 e 07h20 de Brasília (modo agendado); o cron abaixo fica de reserva porque o GitHub chega a atrasar 7 horas.
# Só envia o que ainda não saiu no dia.
on:
  schedule:
    - cron: '40 9 * * 1-5'
    - cron: '20 10 * * 1-5'
  workflow_dispatch:
    inputs:
      modo:
        description: 'teste = monta sem enviar; enviar = envia agora (mesmo se já enviou hoje); descobrir_canal = mostra o id do canal do Telegram; testar_canal = publica uma prévia só no canal; agendado = envio normal do dia'
        type: choice
        options: [teste, enviar, descobrir_canal, testar_canal, agendado]
        default: teste

concurrency:
  group: aspin-newsletter
  cancel-in-progress: false

jobs:
  newsletter:
    name: Montar e enviar
    runs-on: ${{ vars.NEWSLETTER_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      APP_ENV: production
      LOG_LEVEL: INFO
      PYTHONIOENCODING: utf-8
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NEWSLETTER_TO: ${{ secrets.NEWSLETTER_TO }}
      NEWSLETTER_MAILER_URL: ${{ secrets.NEWSLETTER_MAILER_URL }}
      NEWSLETTER_MAILER_TOKEN: ${{ secrets.NEWSLETTER_MAILER_TOKEN }}
      NEWSLETTER_FROM: ${{ vars.NEWSLETTER_FROM || 'aspininforma@gmail.com' }}
      NEWSLETTER_GARIMPO: ${{ vars.NEWSLETTER_GARIMPO || 'true' }}
      NEWSLETTER_TELEGRAM_CHAT: ${{ vars.NEWSLETTER_TELEGRAM_CHAT || '' }}
      NEWSLETTER_TELEGRAM_BOT_TOKEN: ${{ secrets.NEWSLETTER_TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Importar configuração protegida
        env:
          ASPIN_CONFIG_BUNDLE: ${{ secrets.ASPIN_ENV || secrets.ACCS }}
        run: python .github/scripts/import_config.py
      - name: Radar ASPIN
        run: |
          MODO="${{ github.event.inputs.modo }}"
          case "$MODO" in
            teste)  python -m app.newsletter --dry-run --force --out radar.html ;;
            enviar) python -m app.newsletter --force --out radar.html ;;
            descobrir_canal) python -m app.newsletter --descobrir-canal ;;
            testar_canal) python -m app.newsletter --testar-canal ;;
            *)      python -m app.newsletter --out radar.html ;;
          esac
      - name: Guardar a edição (HTML) por 14 dias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: radar-aspin
          path: radar.html
          if-no-files-found: ignore
          retention-days: 14
